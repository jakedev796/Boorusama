name: GitHub release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish."
        required: true
        default: ""
      prerelease:
        description: "Mark the draft release as a prerelease"
        required: true
        type: boolean
        default: false
      recreate_release:
        description: "Delete an existing release and tag before publishing"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Android is the only target this fork ships. The per-OS steps below
        # are left in place and stay inert via their `if:` guards, so another
        # target is a one-entry addition here.
        #
        # windows-zip is additionally blocked: package:libavif's CMake
        # TryCompile path exceeds Windows MAX_PATH (265 chars against a 260
        # limit) and MSBuild's FileTracker ignores LongPathsEnabled.
        include:
          - target: apk
            os: ubuntu-latest
            artifact_name: boorusama-apk

    env:
      BOORUSAMA_USE_FVM: "false"
      OUTPUT_DIR: release-artifacts/${{ matrix.target }}

    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Set up Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Android SDK
        if: matrix.target == 'apk'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: matrix.target == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install native asset build tools
        shell: bash
        run: |
          set -euo pipefail
          # package:libavif builds vendored dav1d from source with Meson and
          # NASM, then a Rust crate. Runner images ship cmake, ninja and
          # rustup, but not meson or nasm, so every target that compiles
          # native assets needs these two added.
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y meson nasm
              ;;
            macOS)
              brew install meson nasm
              ;;
            Windows)
              choco install --no-progress --yes nasm
              python -m pip install --disable-pip-version-check meson
              echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"
              ;;
          esac

      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux-tar.gz' || matrix.target == 'appimage'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            ninja-build \
            pkg-config

      - name: Install Windows packaging dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command Compress-Archive

      - name: Install Apple packaging dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg
          sudo gem install cocoapods

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          ./init.sh

      # Without this, android/app/build.gradle.kts falls back to the DEBUG
      # signing config, and every runner generates its own throwaway debug
      # keystore. Each release would then be signed with a different key, so no
      # APK could ever update another in place -- users would have to uninstall
      # and lose their data on every upgrade. Fail loudly rather than publish
      # an un-updatable build.
      - name: Set up Android signing key
        if: matrix.target == 'apk'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$KEYSTORE_BASE64" ]]   || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]]         || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]]      || missing+=(ANDROID_KEY_PASSWORD)

          if (( ${#missing[@]} )); then
            echo "::error::Missing release signing secret(s): ${missing[*]}."
            echo "::error::Refusing to build an APK that would be debug-signed."
            echo "::error::See 'Cutting a release' in CLAUDE.md for the setup steps."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.jks

          # Gradle reads android/key.properties; storeFile is resolved relative
          # to the android/ directory, which is Gradle's rootProject dir.
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          # Confirm Gradle will actually take the release path, so a silent
          # fallback to debug signing can never reach a published release.
          keytool -list -keystore android/release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "Release keystore is in place and the alias resolves."

      - name: Build GitHub release artifact
        shell: bash
        run: |
          set -euo pipefail

          args=(
            release
            github
            build
            "${{ matrix.target }}"
            --ci
            --allow-dirty
            --output-dir
            "$OUTPUT_DIR"
          )

          if [[ "${{ matrix.target }}" == "ipa" ]]; then
            args+=(--no-codesign)
          fi

          ./build.sh "${args[@]}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ env.OUTPUT_DIR }}/**
          if-no-files-found: error

  publish:
    if: github.actor == github.repository_owner
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BOORUSAMA_USE_FVM: "false"
    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Delete existing release
        if: inputs.recreate_release
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --cleanup-tag \
            --yes || true

      - name: Publish draft GitHub release
        shell: bash
        run: |
          set -euo pipefail

          # --target must list exactly the targets built by the matrix
          # above. Left unset, the CLI requires a receipt for all six and
          # fails the publish for every target the matrix no longer builds.
          args=(
            release
            github
            publish
            --ci
            --repo
            "${{ github.repository }}"
            --artifacts-dir
            release-assets
            --target
            apk
          )

          args+=(--tag "${{ inputs.release_tag }}")
          args+=(--title "Boorusama ${{ inputs.release_tag }}")

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          ./build.sh "${args[@]}"
