org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Cache task outputs so repeat builds reuse plugin compilation instead of
# redoing it. Outputs land in ~/.gradle/caches/build-cache-1, which CI already
# restores, and which cut assembleProdRelease from 784s to 310s.
org.gradle.caching=true
